<div class="shell">
<header class="topbar"><a class="identity" href="#overview" aria-label="Decision guide, all major decisions"><svg viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M5 3v28M5 11h12M5 24h12M17 11h7M17 24h7" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="3" r="2.5" fill="currentColor"/><circle cx="24" cy="11" r="2.5" fill="currentColor"/><circle cx="24" cy="24" r="2.5" fill="currentColor"/></svg><span>Decision guide<small>Architecture reading view</small></span></a><div class="top-actions"><a href="#source">Original source</a><button id="print-button" type="button">Print guide</button></div></header>

<footer class="footer"><p>Based on <a href="#original">the embedded source</a>. Grouping and summaries are reading aids; the original decision text remains authoritative. This page does not revise the design.</p><a href="#overview">Back to the decision map ↑</a></footer>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('guide-data').textContent);
const GROUPS=new Map(DATA.groups.map(g=>[g.id,g]));
const DETAILS=new Map(DATA.groups.flatMap(g=>g.details.map(d=>[d.id,{...d,group:g}])));
const SOURCES=new Map(DATA.sections.map(s=>[s.id,s]));
const main=document.getElementById('main');
const sidebar=document.getElementById('sidebar');
const positions=new Map();
let previousRoute='';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<span class="arrow" aria-hidden="true">↗</span>';
const groupLink=id=>'#group/'+id;
const detailLink=id=>'#detail/'+id;
const sourceLink=id=>'#source/'+id;
function crumb(items){return '<nav class="breadcrumbs" aria-label="Breadcrumb">'+items.map((x,i)=>`${i?'<span class="separator" aria-hidden="true">/</span>':''}${x.href?`<a href="${esc(x.href)}">${esc(x.label)}</a>`:`<span aria-current="page">${esc(x.label)}</span>`}`).join('')+'</nav>'}
function decisionParts(d){return `<div class="choice"><div class="eyebrow">Chosen approach</div><p>${esc(d.answer)}</p></div><div class="reason-grid"><section><h2>Why this choice</h2><p>${esc(d.why)}</p></section><section><h2>The trade-off</h2><p>${esc(d.tradeoff)}</p></section></div>`}
function nav(activeGroup,activeDetail,source=false){sidebar.innerHTML=`<p class="nav-label">Read by decision</p><a class="nav-root" href="#overview" ${!activeGroup&&!source?'aria-current="page"':''}>All major decisions</a><nav class="group-nav" aria-label="Major decisions">${DATA.groups.map(g=>`<div><a class="nav-group" href="${groupLink(g.id)}" ${g.id===activeGroup?'aria-current="page"':''}><span class="nav-dot" aria-hidden="true"></span>${esc(g.label)}</a>${g.id===activeGroup?`<div class="nav-details">${g.details.map(d=>`<a href="${detailLink(d.id)}" ${d.id===activeDetail?'aria-current="page"':''}>${esc(d.title)}</a>`).join('')}</div>`:''}</div>`).join('')}</nav><div class="sidebar-bottom">Go deeper only where you need to.<a href="#source" ${source?'aria-current="page"':''}>Browse the original text ↗</a></div>`}
function home(){nav();document.title=DATA.title+' · Decision guide';main.innerHTML=`<div class="eyebrow">Start with the architecture</div><h1>${esc(DATA.title)}</h1><p class="intro">${DATA.groups.length} major ${DATA.groups.length===1?'choice explains':'choices explain'} the design. Open a branch to see the supporting decisions, their trade-offs and the original reasoning.</p><div class="source-meta"><span class="status">${esc(DATA.sourceStatus)}</span><span class="divider" aria-hidden="true"></span><span>${esc(DATA.sourceDate)}</span><span class="divider" aria-hidden="true"></span><a href="#source">Source text</a></div><div class="map-caption"><h2>The major decisions</h2><span>Overview → supporting choices → source</span></div><div class="decision-map">${DATA.groups.map(g=>`<article class="major"><div class="eyebrow">${esc(g.label)}</div><h3><a href="${groupLink(g.id)}">${esc(g.title)}</a></h3><p>${esc(g.answer)}</p><a class="branch-link" href="${groupLink(g.id)}">${g.details.length} supporting decisions ${arrow}<span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">for ${esc(g.label)}</span></a></article>`).join('')}</div><div class="reading-guide"><div><strong>First, the choice.</strong><p>Understand what the architecture commits to.</p></div><div><strong>Then, the consequences.</strong><p>Explore the decisions that make it work.</p></div><div><strong>Finally, the evidence.</strong><p>Read the exact source when you need precision.</p></div></div>`}
function groupPage(g){nav(g.id);document.title=g.label+' · Decision guide';main.innerHTML=crumb([{label:'All decisions',href:'#overview'},{label:g.label}])+`<div class="eyebrow">Major decision · ${esc(g.label)}</div><h1>${esc(g.title)}</h1>${decisionParts(g)}<h2>Supporting decisions</h2><ul class="branch-list">${g.details.map(d=>`<li><a href="${detailLink(d.id)}"><span><strong>${esc(d.title)}</strong><small>${esc(d.answer)}</small></span>${arrow}</a></li>`).join('')}</ul><section class="related"><h2>Connected major decisions</h2><div class="related-links">${g.connections.map(id=>`<a href="${groupLink(id)}">${esc(GROUPS.get(id).label)} ↗</a>`).join('')}</div></section>`}
function detailPage(d){const g=d.group;nav(g.id,d.id);document.title=d.title+' · Decision guide';const idx=g.details.findIndex(x=>x.id===d.id);main.innerHTML=crumb([{label:'All decisions',href:'#overview'},{label:g.label,href:groupLink(g.id)},{label:'Supporting decision'}])+`<div class="eyebrow">${esc(g.label)} · supporting decision</div><h1>${esc(d.title)}</h1>${decisionParts(d)}<details class="source-box"><summary>Read the original decision (${d.sources.length} source ${d.sources.length===1?'section':'sections'})</summary><div class="source-content">${d.sources.map(id=>{const s=SOURCES.get(id);return `<a class="source-link" href="${sourceLink(id)}">${esc(s.title)} ↗<small>${esc(DATA.sourceName)} · line ${s.line}</small></a>`}).join('')}<p class="source-note">These are the original source sections, including any recorded revisions. The summary above is a reading aid.</p></div></details><nav class="detail-pagination" aria-label="Supporting decisions">${idx>0?`<a href="${detailLink(g.details[idx-1].id)}"><small>Previous decision</small>← ${esc(g.details[idx-1].title)}</a>`:'<span></span>'}${idx<g.details.length-1?`<a href="${detailLink(g.details[idx+1].id)}"><small>Next decision</small>${esc(g.details[idx+1].title)} →</a>`:`<a href="${groupLink(g.id)}"><small>Back to major decision</small>${esc(g.label)} ↑</a>`}</nav>`}
function inline(text){const tokens=[];let work=text.replace(/`([^`]+)`/g,(_,v)=>{tokens.push('<code>'+esc(v)+'</code>');return '\u0001'+(tokens.length-1)+'\u0002'});work=esc(work);work=work.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>{if(/^https:\/\//.test(url))return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;return `<span class="unbundled" title="Reference preserved from the original document; linked file is not bundled here.">${label}</span>`});work=work.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');return work.replace(/\u0001(\d+)\u0002/g,(_,i)=>tokens[Number(i)])}
function markdown(text){const lines=text.replace(/<!--[\s\S]*?-->/g,'').split('\n');let out='',i=0;while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}if(/^\s*(?:`{3,}|~{3,})/.test(line)){const code=[];i++;while(i<lines.length&&!/^\s*(?:`{3,}|~{3,})/.test(lines[i]))code.push(lines[i++]);i++;out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}if(/^\|/.test(line)&&i+1<lines.length&&/^\|[\s:|\-]+$/.test(lines[i+1])){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=row=>row.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));out+='<div class="table-wrap" role="region" aria-label="Source decision table" tabindex="0"><table><thead><tr>'+cells(rows[0]).map(c=>'<th scope="col">'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(2).map(row=>'<tr>'+cells(row).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}if(/^#{1,6} /.test(line)){out+='<h3>'+inline(line.replace(/^#+ /,''))+'</h3>';i++;continue}if(/^\s*[-*] /.test(line)){out+='<ul>';while(i<lines.length&&/^\s*[-*] /.test(lines[i]))out+='<li>'+inline(lines[i++].replace(/^\s*[-*] /,''))+'</li>';out+='</ul>';continue}if(/^\d+\. /.test(line)){out+='<ol>';while(i<lines.length&&/^\d+\. /.test(lines[i]))out+='<li>'+inline(lines[i++].replace(/^\d+\. /,''))+'</li>';out+='</ol>';continue}const para=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(?:`{3,}|~{3,})|^#{1,6} |^\|/.test(lines[i]))para.push(lines[i++]);if(!para.length)para.push(lines[i++]);out+='<p>'+inline(para.join(' '))+'</p>'}return out}
function sourceIndex(){nav(null,null,true);document.title='Original source · Decision guide';main.innerHTML=crumb([{label:'All decisions',href:'#overview'},{label:'Original source'}])+`<div class="eyebrow">Source document</div><h1>The original decisions.</h1><p class="intro">Browse the source sections without the reading hierarchy. Historical and superseded entries are retained; later explicit revisions take precedence.</p><p class="source-note">Source: <a href="#original">${esc(DATA.sourceName)}</a> · ${esc(DATA.sourceDate)}. Links to other local source documents are preserved as references, not followed or bundled.</p><ul class="source-index">${DATA.sections.map(s=>`<li><a href="${sourceLink(s.id)}"><span>${esc(s.title)}${/^Superseded/.test(s.title)?'<span class="history-label">Historical</span>':''}</span><small>Line ${s.line}</small></a></li>`).join('')}</ul>`}
function sourcePage(s){nav(null,null,true);document.title=s.title+' · Original source';main.innerHTML=crumb([{label:'All decisions',href:'#overview'},{label:'Original source',href:'#source'},{label:'Source section'}])+`<div class="eyebrow">Original source · line ${s.line}</div><h1>${esc(s.title)}</h1><div class="source-reading">${markdown(s.text)}</div><details class="raw-source"><summary>View exact Markdown</summary><pre>${esc(s.text)}</pre></details><p class="source-note">Copied from <a href="#original">${esc(DATA.sourceName)}</a>, starting at line ${s.line}. This section is shown as written; later explicit source decisions may supersede earlier text.</p><section class="related"><a href="#source">← All source sections</a></section>`}
function originalPage(){nav(null,null,true);document.title='Original Markdown · Decision guide';main.innerHTML=crumb([{label:'All decisions',href:'#overview'},{label:'Original source',href:'#source'},{label:'Exact Markdown'}])+`<div class="eyebrow">Embedded source document</div><h1>${esc(DATA.sourceName)}</h1><p class="intro">The original Markdown is embedded unchanged. Other referenced files are not opened or bundled.</p><button type="button" data-action="download-source">Download original Markdown</button><p class="source-note">SHA-256: <code style="overflow-wrap:anywhere">${esc(DATA.sourceSha256)}</code></p><div class="raw-source"><pre>${esc(DATA.sourceRaw)}</pre></div>`}
function route(){const key=location.hash.slice(1)||'overview';if(previousRoute)positions.set(previousRoute,window.scrollY);const parts=key.split('/');if(key==='overview')home();else if(parts[0]==='group'&&GROUPS.has(parts[1]))groupPage(GROUPS.get(parts[1]));else if(parts[0]==='detail'&&DETAILS.has(parts[1]))detailPage(DETAILS.get(parts[1]));else if(key==='source')sourceIndex();else if(key==='original')originalPage();else if(parts[0]==='source'&&SOURCES.has(parts[1]))sourcePage(SOURCES.get(parts[1]));else{nav();document.title='Decision not found · Decision guide';main.innerHTML='<div class="unknown"><h1>That decision is not here.</h1><p>The link may be incomplete or from an older guide.</p><a href="#overview">Return to all major decisions</a></div>'}previousRoute=key;main.dataset.route=key;const heading=main.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}window.scrollTo({top:positions.get(key)||0,behavior:'instant'})}
window.addEventListener('hashchange',route);
document.getElementById('skip-link').addEventListener('click',event=>{event.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'instant'})});
main.addEventListener('click',event=>{if(!event.target.closest('[data-action=download-source]'))return;const url=URL.createObjectURL(new Blob([DATA.sourceRaw],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=DATA.sourceName;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('print-button').addEventListener('click',()=>window.print());
window.addEventListener('beforeprint',()=>{document.getElementById('print-content').innerHTML='<h1>'+esc(DATA.title)+'</h1><p>Reading guide to '+esc(DATA.sourceName)+' · '+esc(DATA.sourceDate)+'. Summaries are editorial; original decisions remain authoritative.</p>'+DATA.groups.map(g=>`<section class="print-group"><h2>${esc(g.title)}</h2><p>${esc(g.answer)}</p><p><strong>Trade-off:</strong> ${esc(g.tradeoff)}</p>${g.details.map(d=>`<article><h3>${esc(d.title)}</h3><p><span class="print-label">Chosen approach:</span> ${esc(d.answer)}</p><p><span class="print-label">Why:</span> ${esc(d.why)}</p><p><span class="print-label">Trade-off:</span> ${esc(d.tradeoff)}</p><p class="print-source">Source: ${d.sources.map(id=>esc(SOURCES.get(id).title)+' (line '+SOURCES.get(id).line+')').join('; ')}</p></article>`).join('')}</section>`).join('')});
route();
</script>
</body>
